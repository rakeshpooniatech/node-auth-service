services:
  mongodb:
    image: mongo:7
    container_name: node-auth-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: node-auth-service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/node_auth_service
      JWT_ACCESS_SECRET: replace_with_a_long_random_access_secret
      JWT_REFRESH_SECRET: replace_with_a_long_random_refresh_secret
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000

volumes:
  mongodb_data:
